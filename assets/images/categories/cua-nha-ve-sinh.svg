<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bathWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D3D3D3"/>
      <stop offset="50%" style="stop-color:#F5F5F5"/>
      <stop offset="100%" style="stop-color:#E8E8E8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="5" dy="5" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="#E8E8E8"/>
  
  <!-- Subtle Grid Pattern -->
  <pattern id="gridPattern" patternUnits="userSpaceOnUse" width="20" height="20">
    <rect width="20" height="20" fill="#F0F0F0"/>
    <line x1="20" y1="0" x2="20" y2="20" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="20" x2="20" y2="20" stroke="#E0E0E0" stroke-width="0.5"/>
  </pattern>
  <rect width="400" height="500" fill="url(#gridPattern)"/>
  
  <!-- Door Frame - White/Painted -->
  <rect x="60" y="30" width="280" height="440" rx="5" fill="#A9A9A9" filter="url(#shadow)"/>
  
  <!-- Door Panel - Clean White -->
  <rect x="75" y="45" width="250" height="410" rx="3" fill="url(#bathWood)"/>
  
  <!-- Subtle Texture Lines -->
  <g stroke="#D0D0D0" stroke-width="0.5" opacity="0.3">
    <line x1="80" y1="100" x2="320" y2="100"/>
    <line x1="80" y1="200" x2="320" y2="200"/>
    <line x1="80" y1="300" x2="320" y2="300"/>
    <line x1="80" y1="400" x2="320" y2="400"/>
  </g>
  
  <!-- Water Drop Icon - Indicating Water Resistant -->
  <g transform="translate(180, 150)">
    <path d="M20 0 Q35 25 20 45 Q5 25 20 0" fill="#4A90D9" opacity="0.8"/>
    <ellipse cx="20" cy="35" rx="8" ry="5" fill="#FFFFFF" opacity="0.4"/>
  </g>
  
  <!-- Simple Modern Handle -->
  <rect x="280" y="240" width="12" height="45" rx="6" fill="#C0C0C0"/>
  <rect x="282" y="244" width="8" height="37" rx="4" fill="#D8D8D8"/>
  
  <!-- Simple Lock -->
  <rect x="282" y="300" width="12" height="20" rx="2" fill="#A0A0A0"/>
  <circle cx="288" cy="315" r="2" fill="#606060"/>
  
  <!-- Brand Label - Minimal -->
  <rect x="155" y="400" width="90" height="20" rx="2" fill="#808080"/>
  <text x="200" y="414" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LUMI DOOR</text>
</svg>
