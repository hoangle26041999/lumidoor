<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="archWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CD853F"/>
      <stop offset="50%" style="stop-color:#DEB887"/>
      <stop offset="100%" style="stop-color:#CD853F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="5" dy="5" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
    <clipPath id="archClip">
      <path d="M60 470 L60 200 Q60 30 200 30 Q340 30 340 200 L340 470 Z"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="#F5EBE0"/>
  
  <!-- Wood Pattern Background -->
  <pattern id="archPattern" patternUnits="userSpaceOnUse" width="35" height="35">
    <rect width="35" height="35" fill="#DEB887" opacity="0.25"/>
    <path d="M0 17 Q17 15 35 17" stroke="#CD853F" stroke-width="0.5" fill="none" opacity="0.4"/>
  </pattern>
  <rect width="400" height="500" fill="url(#archPattern)"/>
  
  <!-- Door Frame - Arch Shape -->
  <path d="M60 470 L60 200 Q60 30 200 30 Q340 30 340 200 L340 470 Z" fill="#6B3410" filter="url(#shadow)"/>
  
  <!-- Door Panel - Arch Shape -->
  <path d="M75 455 L75 200 Q75 45 200 45 Q325 45 325 200 L325 455 Z" fill="url(#archWood)"/>
  
  <!-- Arch Decorative Elements -->
  <g clip-path="url(#archClip)">
    <!-- Carved Border -->
    <path d="M85 445 L85 200 Q85 55 200 55 Q315 55 315 200 L315 445 Z" fill="none" stroke="#8B4513" stroke-width="2" opacity="0.5"/>
    
    <!-- Ornate Top Arch -->
    <path d="M90 180 Q90 60 200 60 Q310 60 310 180" fill="none" stroke="#8B4513" stroke-width="3" opacity="0.6"/>
    <path d="M100 170 Q100 75 200 75 Q300 75 300 170" fill="none" stroke="#6B3410" stroke-width="2" opacity="0.4"/>
    
    <!-- Decorative Scrolls -->
    <path d="M100 200 Q120 150 200 140 Q280 150 300 200" fill="none" stroke="#8B4513" stroke-width="1.5" opacity="0.5"/>
    <path d="M110 210 Q130 165 200 155 Q270 165 290 210" fill="none" stroke="#6B3410" stroke-width="1" opacity="0.4"/>
    
    <!-- Panel Details -->
    <rect x="95" y="220" width="210" height="100" rx="5" fill="none" stroke="#8B4513" stroke-width="2" opacity="0.5"/>
    <rect x="100" y="225" width="200" height="90" rx="3" fill="none" stroke="#6B3410" stroke-width="1" opacity="0.4"/>
    
    <!-- Lower Panels -->
    <rect x="95" y="340" width="100" height="100" rx="3" fill="none" stroke="#8B4513" stroke-width="1.5" opacity="0.5"/>
    <rect x="205" y="340" width="100" height="100" rx="3" fill="none" stroke="#8B4513" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Door Handle - Ornate -->
  <ellipse cx="285" cy="270" rx="10" ry="15" fill="#D4AF37"/>
  <ellipse cx="285" cy="270" rx="6" ry="10" fill="#E5C158"/>
  
  <!-- Ornate Brand Label -->
  <ellipse cx="200" cy="420" rx="50" ry="20" fill="#D4AF37"/>
  <text x="200" y="425" font-family="serif" font-size="14" font-weight="bold" fill="#8B4513" text-anchor="middle">LUMI DOOR</text>
</svg>
