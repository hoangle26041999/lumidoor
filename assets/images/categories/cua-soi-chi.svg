<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="woodGrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="30%" style="stop-color:#A0522D"/>
      <stop offset="50%" style="stop-color:#CD853F"/>
      <stop offset="70%" style="stop-color:#A0522D"/>
      <stop offset="100%" style="stop-color:#8B4513"/>
    </linearGradient>
    <linearGradient id="woodVeneer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="20%" style="stop-color:#CD853F"/>
      <stop offset="40%" style="stop-color:#DEB887"/>
      <stop offset="60%" style="stop-color:#CD853F"/>
      <stop offset="80%" style="stop-color:#A0522D"/>
      <stop offset="100%" style="stop-color:#8B4513"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="5" dy="5" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="#F5EBE0"/>
  
  <!-- Wood Pattern Background -->
  <pattern id="woodPattern" patternUnits="userSpaceOnUse" width="40" height="40">
    <rect width="40" height="40" fill="#DEB887" opacity="0.3"/>
    <path d="M0 20 Q10 18 20 20 T40 20" stroke="#CD853F" stroke-width="0.5" fill="none" opacity="0.5"/>
    <path d="M0 10 Q15 8 30 10 T40 10" stroke="#CD853F" stroke-width="0.3" fill="none" opacity="0.3"/>
    <path d="M0 30 Q12 32 24 30 T40 30" stroke="#CD853F" stroke-width="0.3" fill="none" opacity="0.3"/>
  </pattern>
  <rect width="400" height="500" fill="url(#woodPattern)"/>
  
  <!-- Door Frame -->
  <rect x="60" y="30" width="280" height="440" rx="5" fill="#6B3410" filter="url(#shadow)"/>
  
  <!-- Door Panel -->
  <rect x="75" y="45" width="250" height="410" rx="3" fill="url(#woodVeneer)"/>
  
  <!-- Wood Grain Lines -->
  <g stroke="#8B4513" stroke-width="0.5" opacity="0.4">
    <path d="M80 50 Q200 48 320 50"/>
    <path d="M80 100 Q180 98 320 100"/>
    <path d="M80 150 Q220 148 320 150"/>
    <path d="M80 200 Q160 198 320 200"/>
    <path d="M80 250 Q200 252 320 250"/>
    <path d="M80 300 Q180 298 320 300"/>
    <path d="M80 350 Q220 352 320 350"/>
    <path d="M80 400 Q160 398 320 400"/>
  </g>
  
  <!-- Carved Decorative Lines (Soi ChÉ) -->
  <g fill="none" stroke="#6B3410" stroke-width="2" opacity="0.6">
    <!-- Top Panel -->
    <rect x="90" y="60" width="220" height="80" rx="2"/>
    <rect x="95" y="65" width="210" height="70" rx="1"/>
    <rect x="100" y="70" width="200" height="60" rx="1"/>
    
    <!-- Middle Panel Left -->
    <rect x="90" y="160" width="105" height="120" rx="2"/>
    <rect x="95" y="165" width="95" height="110" rx="1"/>
    <rect x="100" y="170" width="85" height="100" rx="1"/>
    
    <!-- Middle Panel Right -->
    <rect x="205" y="160" width="105" height="120" rx="2"/>
    <rect x="210" y="165" width="95" height="110" rx="1"/>
    <rect x="215" y="170" width="85" height="100" rx="1"/>
    
    <!-- Bottom Panel -->
    <rect x="90" y="300" width="220" height="140" rx="2"/>
    <rect x="95" y="305" width="210" height="130" rx="1"/>
    <rect x="100" y="310" width="200" height="120" rx="1"/>
  </g>
  
  <!-- Door Handle -->
  <ellipse cx="295" cy="260" rx="12" ry="18" fill="#D4AF37"/>
  <ellipse cx="295" cy="260" rx="8" ry="12" fill="#E5C158"/>
  <circle cx="295" cy="260" r="4" fill="#8B4513"/>
  
  <!-- Door Lock -->
  <rect x="285" y="290" width="20" height="30" rx="3" fill="#D4AF37"/>
  <circle cx="295" cy="305" r="3" fill="#8B4513"/>
  
  <!-- Brand Label -->
  <rect x="140" y="380" width="120" height="35" rx="3" fill="#8B4513" opacity="0.9"/>
  <text x="200" y="402" font-family="serif" font-size="14" font-weight="bold" fill="#D4AF37" text-anchor="middle">LUMI DOOR</text>
</svg>
