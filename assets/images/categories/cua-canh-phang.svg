<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="flatWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="50%" style="stop-color:#A0522D"/>
      <stop offset="100%" style="stop-color:#8B4513"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="5" dy="5" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="#F5EBE0"/>
  
  <!-- Wood Pattern Background -->
  <pattern id="woodPattern2" patternUnits="userSpaceOnUse" width="30" height="30">
    <rect width="30" height="30" fill="#CD853F" opacity="0.2"/>
    <line x1="0" y1="15" x2="30" y2="15" stroke="#A0522D" stroke-width="0.3" opacity="0.3"/>
  </pattern>
  <rect width="400" height="500" fill="url(#woodPattern2)"/>
  
  <!-- Door Frame -->
  <rect x="60" y="30" width="280" height="440" rx="5" fill="#6B3410" filter="url(#shadow)"/>
  
  <!-- Flat Door Panel - Clean Modern Design -->
  <rect x="75" y="45" width="250" height="410" rx="3" fill="url(#flatWood)"/>
  
  <!-- Subtle Wood Grain - Minimal -->
  <g stroke="#6B3410" stroke-width="0.3" opacity="0.2">
    <path d="M80 50 Q200 48 320 50"/>
    <path d="M80 150 Q200 152 320 150"/>
    <path d="M80 250 Q200 248 320 250"/>
    <path d="M80 350 Q200 352 320 350"/>
  </g>
  
  <!-- Modern Flat Panel Lines -->
  <g stroke="#6B3410" stroke-width="1" opacity="0.3">
    <line x1="80" y1="100" x2="320" y2="100"/>
    <line x1="80" y1="400" x2="320" y2="400"/>
  </g>
  
  <!-- Door Handle - Modern Design -->
  <rect x="280" y="230" width="15" height="50" rx="7.5" fill="#D4AF37"/>
  <rect x="282" y="235" width="11" height="40" rx="5.5" fill="#E5C158"/>
  
  <!-- Door Lock - Modern -->
  <rect x="282" y="295" width="15" height="25" rx="3" fill="#D4AF37"/>
  <circle cx="289.5" cy="312" r="2.5" fill="#8B4513"/>
  
  <!-- Minimalist Brand Label -->
  <rect x="155" y="405" width="90" height="25" rx="2" fill="#D4AF37"/>
  <text x="200" y="422" font-family="sans-serif" font-size="10" font-weight="bold" fill="#8B4513" text-anchor="middle">LUMI DOOR</text>
</svg>
