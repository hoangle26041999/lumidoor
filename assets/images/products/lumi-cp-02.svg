<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="productWood2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5D3A1A"/>
      <stop offset="50%" style="stop-color:#8B4513"/>
      <stop offset="100%" style="stop-color:#5D3A1A"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#FFF8F0"/>
  
  <!-- Door Frame -->
  <rect x="60" y="20" width="280" height="360" rx="5" fill="#4A2C0A"/>
  
  <!-- Door Panel - Flat Design -->
  <rect x="75" y="35" width="250" height="330" rx="3" fill="url(#productWood2)"/>
  
  <!-- Subtle Lines -->
  <g stroke="#4A2C0A" stroke-width="0.5" opacity="0.3">
    <line x1="80" y1="100" x2="320" y2="100"/>
    <line x1="80" y1="300" x2="320" y2="300"/>
  </g>
  
  <!-- Modern Handle -->
  <rect x="280" y="175" width="12" height="40" rx="6" fill="#D4AF37"/>
  
  <!-- Brand -->
  <text x="200" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#D4AF37" text-anchor="middle">LUMI CP-02</text>
</svg>
