<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="productWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="30%" style="stop-color:#CD853F"/>
      <stop offset="50%" style="stop-color:#DEB887"/>
      <stop offset="70%" style="stop-color:#CD853F"/>
      <stop offset="100%" style="stop-color:#8B4513"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#FFF8F0"/>
  
  <!-- Door Frame -->
  <rect x="60" y="20" width="280" height="360" rx="5" fill="#6B3410"/>
  
  <!-- Door Panel -->
  <rect x="75" y="35" width="250" height="330" rx="3" fill="url(#productWood)"/>
  
  <!-- Carved Panels -->
  <g stroke="#6B3410" stroke-width="2" opacity="0.5">
    <rect x="90" y="50" width="220" height="70" rx="2"/>
    <rect x="90" y="135" width="105" height="100" rx="2"/>
    <rect x="205" y="135" width="105" height="100" rx="2"/>
    <rect x="90" y="250" width="220" height="100" rx="2"/>
  </g>
  
  <!-- Handle -->
  <ellipse cx="295" cy="190" rx="10" ry="15" fill="#D4AF37"/>
  
  <!-- Brand -->
  <text x="200" y="320" font-family="serif" font-size="12" font-weight="bold" fill="#D4AF37" text-anchor="middle">LUMI SC-01</text>
</svg>
